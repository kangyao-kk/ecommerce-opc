[project]
name = "ecommerce-opc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.146.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.1.5",
]

[project.scripts]
ecommerce-opc = "ecommerce_opc:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
